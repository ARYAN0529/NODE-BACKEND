<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedesk</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'DM Sans', sans-serif; }
      .font-display { font-family: 'Bebas Neue', sans-serif; }
      .grid-bg {
        background-image:
          linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      .logo-gradient {
        background: linear-gradient(135deg, #fff 40%, #52525b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #pokemonImage { transition: transform 0.3s ease; image-rendering: pixelated; }
      #pokemonImage:hover { transform: scale(1.08) translateY(-6px); }
    </style>
  </head>

  <body class="bg-[#09090f] min-h-screen text-white overflow-x-hidden">

    <!-- Grid background -->
    <div class="grid-bg fixed inset-0 pointer-events-none z-0"></div>

    <div class="relative z-10 max-w-5xl mx-auto px-6 py-12">

      <header class="flex items-end gap-3 mb-14">
        <span class="w-3.5 h-3.5 rounded-full bg-pink-500 shrink-0 shadow-[0_0_16px_#ef4444] mb-1"></span>
        <h1 class="font-display logo-gradient text-5xl tracking-[4px] leading-none">Pokédex</h1>
      </header>

      <!-- Search -->
      <form id="pokemonForm" action="" method="" class="flex gap-2.5 mb-14 max-w-lg">
        <input
          id="pokemonInput"
          type="text"
          name="name"
          placeholder="e.g. pikachu, charizard, #6…"
          autocomplete="off"
          class="flex-1 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/15 text-white placeholder-zinc-600 rounded-xl px-5 py-3.5 text-[15px] outline-none transition"
        />
        <button
          type="submit"
          class="bg-violet-700 hover:bg-violet-600 active:scale-95 text-white font-semibold px-7 py-3.5 rounded-xl tracking-wide transition text-sm"
        >
          Search
        </button>
      </form>

      <div id="pokemonCard" class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
        <div class="grid grid-cols-1 md:grid-cols-[320px_1fr]">

          <!-- Left panel -->
          <div class="relative bg-zinc-800/40 border-b md:border-b-0 md:border-r border-zinc-800 flex flex-col items-center justify-center gap-5 px-8 py-12 overflow-hidden">
            <div class="absolute w-56 h-56 rounded-full bg-violet-600/10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 blur-2xl pointer-events-none"></div>
            <img
              id="pokemonImage"
              src=""
              alt=""
              class="w-48 h-48 object-contain relative z-10 drop-shadow-2xl"
            />
            <div id="pokemonType" class="flex gap-2 flex-wrap justify-center relative z-10"></div>
          </div>

          <div class="px-8 md:px-10 py-10 flex flex-col gap-8">

            <div>
              <p class="text-[10px] font-semibold tracking-[2.5px] uppercase text-zinc-600 mb-1">Name</p>
              <h2 id="pokemonName" class="font-display text-6xl tracking-wide leading-none capitalize text-white"></h2>
            </div>

            <div>
              <p class="text-[10px] font-semibold tracking-[2.5px] uppercase text-zinc-600 mb-3">Measurements</p>
              <div class="grid grid-cols-2 gap-3">
                <div class="bg-zinc-800/60 border border-zinc-800 rounded-xl px-4 py-4">
                  <p class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1.5">Height</p>
                  <p id="pokemonHeight" class="font-display text-3xl leading-none text-white"></p>
                </div>
                <div class="bg-zinc-800/60 border border-zinc-800 rounded-xl px-4 py-4">
                  <p class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1.5">Weight</p>
                  <p id="pokemonWeight" class="font-display text-3xl leading-none text-white"></p>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>

    <script src="javascript.js"></script>

  </body>
</html>
