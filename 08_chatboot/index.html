<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ChatBot</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body
  class="
    bg-zinc-950
    flex
    justify-center
    items-center
    min-h-screen
    p-4
    bg-[linear-gradient(rgba(255,255,255,0.025)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.025)_1px,transparent_1px)]
    bg-[size:56px_56px]
  "
>
    <div class="w-full max-w-3xl h-[90vh] bg-zinc-900 rounded-2xl border border-zinc-800 flex flex-col overflow-hidden">

        <!-- Header -->
        <div class="p-4 border-b border-zinc-800 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-violet-600 flex items-center justify-center">
                🤖
            </div>

            <div>
                <h1 class="text-white font-semibold">AI Assistant</h1>
                <!-- <p class="text-zinc-400 text-sm">Online</p> -->
            </div>
        </div>

        <!-- Messages Area -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4">

            <!-- Bot Message -->
            <div class="flex">
                <div class="max-w-[75%] bg-zinc-800 text-white px-4 py-3 rounded-2xl rounded-bl-sm" id="botmessage">
                </div>
            </div>

            <!-- User Message -->
            <div class="flex justify-end">
                <div class="max-w-[75%] bg-violet-600 text-white px-4 py-3 rounded-2xl rounded-br-sm" id="usermessage">

                </div>
            </div>

        </div>

        <!-- Input Area -->
        <div class="p-4 border-t border-zinc-800">
            <form class="flex gap-3" id="inputform">
                
                <input
                    type="text"
                    placeholder="Type a message..."
                    class="flex-1 bg-zinc-800 text-white px-4 py-3 rounded-xl outline-none border border-transparent focus:border-violet-500"
                >

                <button
                    class="px-6 py-3 bg-violet-600 text-white rounded-xl hover:bg-violet-700 transition" action="submit"
                >
                    Send
                </button>

            </form>
        </div>

    </div>
    <script src="javascript.js"></script>
</body>
</html>
